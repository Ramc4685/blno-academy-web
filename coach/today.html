<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Coach Today | BlNo Badminton Academy</title>
    <link rel="icon" href="../favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="../css/styles.css">
  </head>
  <body>
    <header class="topbar">
      <a class="brand-link" href="../index.html"><img class="brand-logo" src="../logo.svg" alt=""><span>BlNo Academy</span></a>
      <nav class="nav-tabs">
        <a class="active" href="today.html">Today</a>
        <a href="../coach.html">Sessions</a>
        <a href="payslip/">Payslip</a>
      </nav>
      <div class="user-chip"><span data-user-email></span><button data-sign-out>Sign out</button></div>
    </header>
    <main class="page">
      <section class="page-heading">
        <div>
          <h1>Today</h1>
          <p>Today’s classes with quick roster and attendance shortcuts.</p>
        </div>
        <label class="month-control">Date <input id="coachTodayDate" type="date"></label>
      </section>
      <section class="stat-grid">
        <article class="stat-card"><span>Today sessions</span><strong id="todaySessionCount">0</strong></article>
        <article class="stat-card"><span>Expected payout</span><strong id="todayPayout">$0</strong></article>
      </section>
      <section id="coachTodaySessions" class="session-stack"></section>
    </main>
    <script src="../js/config.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/ui.js"></script>
    <script src="../js/pwa.js"></script>
    <script src="../js/coach.js"></script>
  </body>
</html>

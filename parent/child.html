<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Child Detail | BlNo Badminton Academy</title>
    <link rel="icon" href="../favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="../css/styles.css">
  </head>
  <body>
    <header class="topbar">
      <a class="brand-link" href="../index.html"><img class="brand-logo" src="../logo.svg" alt=""><span>BlNo Academy</span></a>
      <nav class="nav-tabs">
        <a href="../parent.html">My Kids</a>
        <a href="schedule.html">Schedule</a>
        <a href="history/">History</a>
      </nav>
      <div class="user-chip"><span data-user-email></span><button data-sign-out>Sign out</button></div>
    </header>
    <main class="page">
      <section class="page-heading">
        <div>
          <h1 id="childTitle">Child Detail</h1>
          <p>Session, payments, attendance percentage, and movement history.</p>
        </div>
      </section>
      <section id="childDetail" class="card-grid"></section>
      <section class="panel">
        <div class="panel-header"><h2>Month History</h2></div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Month</th><th>Enrolled</th><th>Paid</th><th>Due</th><th>Attendance</th></tr></thead>
            <tbody id="childMonthRows"></tbody>
          </table>
        </div>
      </section>
    </main>
    <script src="../js/config.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/ui.js"></script>
    <script src="../js/pwa.js"></script>
    <script src="../js/parent.js"></script>

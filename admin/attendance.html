<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mark Attendance | BLno Badminton Academy</title>
    <link rel="icon" href="../favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="../css/styles.css">
  </head>
  <body>
    <header class="topbar">
      <a class="brand-link" href="../index.html"><span class="brand-mark">B</span><span>BLno Academy</span></a>
      <nav class="nav-tabs">
        <a href="../admin.html">Dashboard</a>
        <a href="dues.html">Dues</a>
        <a href="sessions.html">Sessions</a>
        <a href="coaches.html">Coaches</a>
        <a href="payments.html">Payments</a>
        <a class="active" href="attendance.html">Attendance</a>
      </nav>
      <div class="user-chip"><span data-user-email></span><button data-sign-out>Sign out</button></div>
    </header>

    <main class="page">
      <section class="page-heading">
        <div>
          <h1>Mark Attendance</h1>
          <p>Write attendance rows to Attendance_Log with one row per kid.</p>
        </div>
      </section>

      <section class="panel workflow-panel">
        <form id="attendanceForm">
          <div class="form-card">
            <div class="form-grid">
              <label>Date<input id="attendanceDate" type="date" required></label>
              <label>Month<select id="attendanceMonth" required></select></label>
              <label class="span-2">Session<select id="attendanceSession" required></select></label>
            </div>
          </div>
          <div class="form-card">
            <div class="panel-header">
              <h2>Attendance Roster</h2>
              <span id="attendanceProgress" class="tag">0 marked</span>
            </div>
            <div id="attendanceRows" class="attendance-roster"></div>
            <button class="primary-action" type="submit">Save Attendance</button>
          </div>
        </form>
        <div id="attendanceStatus" class="status-line"></div>
      </section>
    </main>

    <script src="../js/config.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/ui.js"></script>
    <script src="../js/pwa.js"></script>
    <script src="../js/admin.js"></script>
  </body>
</html>

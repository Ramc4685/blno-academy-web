<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mark Payments | BLno Badminton Academy</title>
    <link rel="icon" href="../favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="../css/styles.css">
  </head>
  <body>
    <header class="topbar">
      <a class="brand-link" href="../index.html"><span class="brand-mark">B</span><span>BLno Academy</span></a>
      <nav class="nav-tabs">
        <a href="../admin.html">Dashboard</a>
        <a href="dues.html">Dues</a>
        <a href="sessions.html">Sessions</a>
        <a href="coaches.html">Coaches</a>
        <a class="active" href="payments.html">Payments</a>
        <a href="attendance.html">Attendance</a>
      </nav>
      <div class="user-chip"><span data-user-email></span><button data-sign-out>Sign out</button></div>
    </header>

    <main class="page">
      <section class="page-heading">
        <div>
          <h1>Mark Payments</h1>
          <p>Update the selected month Pay cell and append a payment audit row.</p>
        </div>
      </section>

      <section class="panel">
        <form id="paymentForm" class="form-grid">
          <label class="span-2">Search player<input id="paymentSearch" type="search" placeholder="Type kid or parent name"></label>
          <label>Kid<select id="paymentKid" required></select></label>
          <label>Month<select id="paymentMonth" required></select></label>
          <label>Amount<input id="paymentAmount" type="number" min="0" step="1" required></label>
          <label>Method<select id="paymentMethod"><option>Zelle</option><option>Cash</option><option>Check</option><option>Other</option></select></label>
          <label class="span-2">Note<input id="paymentNote" type="text" placeholder="Optional memo"></label>
          <button class="primary-action" type="submit">Mark payment</button>
        </form>
        <div id="paymentCurrent" class="status-line"></div>
        <div id="paymentStatus" class="status-line"></div>
      </section>
    </main>

    <script src="../js/config.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/ui.js"></script>
    <script src="../js/pwa.js"></script>
    <script src="../js/admin.js"></script>
  </body>
</html>

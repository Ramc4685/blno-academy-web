<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mark Payments | BLno Badminton Academy</title>
    <link rel="icon" href="../favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="../css/styles.css">
  </head>
  <body>
    <header class="topbar">
      <a class="brand-link" href="../index.html"><span class="brand-mark">B</span><span>BLno Academy</span></a>
      <nav class="nav-tabs">
        <a href="../admin.html">Dashboard</a>
        <a href="dues.html">Dues</a>
        <a href="sessions.html">Sessions</a>
        <a href="coaches.html">Coaches</a>
        <a class="active" href="payments.html">Payments</a>
        <a href="attendance.html">Attendance</a>
      </nav>
      <div class="user-chip"><span data-user-email></span><button data-sign-out>Sign out</button></div>
    </header>

    <main class="page">
      <section class="page-heading">
        <div>
          <h1>Mark Payments</h1>
          <p>Update the selected month Pay cell and append a payment audit row.</p>
        </div>
      </section>

      <section class="panel workflow-panel">
        <form id="paymentForm">
          <section class="form-card">
            <h2>Student search</h2>
            <label class="search-field">Search player<input id="paymentSearch" type="search" placeholder="Type kid, parent, or phone"></label>
            <label>Kid<select id="paymentKid" required></select></label>
            <div id="paymentSelected" class="student-summary" aria-live="polite"></div>
          </section>

          <section class="form-card">
            <h2>Payment details</h2>
            <div class="form-grid">
              <label>Billing month<select id="paymentMonth" required></select></label>
              <label>Payment amount<input id="paymentAmount" type="number" min="0" step="1" required></label>
              <label class="span-2">Note<input id="paymentNote" type="text" placeholder="Optional memo"></label>
            </div>
          </section>

          <section class="form-card">
            <h2>Payment method</h2>
            <input id="paymentMethod" type="hidden" value="Zelle">
            <div class="method-grid" role="group" aria-label="Payment method">
              <button class="method-option active" type="button" data-payment-method="Zelle">Zelle</button>
              <button class="method-option" type="button" data-payment-method="Cash">Cash</button>
              <button class="method-option" type="button" data-payment-method="Check">Check</button>
              <button class="method-option" type="button" data-payment-method="Other">Other</button>
            </div>
          </section>

          <div id="paymentCurrent" class="payment-summary" aria-live="polite"></div>
          <button class="primary-action" type="submit">Save Payment</button>
        </form>
        <div id="paymentStatus" class="status-line"></div>
      </section>
    </main>

    <script src="../js/config.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/ui.js"></script>
    <script src="../js/pwa.js"></script>
    <script src="../js/admin.js"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Outstanding Dues | BLno Badminton Academy</title>
    <link rel="icon" href="../favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="../css/styles.css">
  </head>
  <body>
    <header class="topbar">
      <a class="brand-link" href="../index.html"><span class="brand-mark">B</span><span>BLno Academy</span></a>
      <nav class="nav-tabs">
        <a href="../admin.html">Dashboard</a>
        <a class="active" href="dues.html">Dues</a>
        <a href="sessions.html">Sessions</a>
        <a href="coaches.html">Coaches</a>
      </nav>
      <div class="user-chip"><span data-user-email></span><button data-sign-out>Sign out</button></div>
    </header>

    <main class="page">
      <section class="page-heading">
        <div>
          <h1>Outstanding Dues</h1>
          <p>Follow-up queue from Dues_Followup.</p>
        </div>
        <label class="month-control">Filter
          <select id="duesFilter">
            <option value="all">All time</option>
            <option value="current">This month</option>
          </select>
        </label>
      </section>

      <section class="panel">
        <div class="table-wrap">
          <table>
            <thead><tr><th>Kid</th><th>Parent</th><th>Phone</th><th>Total due</th><th>Status</th></tr></thead>
            <tbody id="duesRows"></tbody>
          </table>
        </div>
      </section>
    </main>

    <script src="../js/config.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/ui.js"></script>
    <script src="../js/pwa.js"></script>
    <script src="../js/admin.js"></script>
  </body>
</html>

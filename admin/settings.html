<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Settings | BlNo Badminton Academy</title>
    <link rel="icon" href="../favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="../css/styles.css">
  </head>
  <body>
    <header class="topbar">
      <a class="brand-link" href="../index.html"><img class="brand-logo" src="../logo.svg" alt=""><span>BlNo Academy</span></a>
      <nav class="nav-tabs">
        <a href="../admin.html">Dashboard</a>
        <a href="dues.html">Dues</a>
        <a href="sessions.html">Sessions</a>
        <a href="payments.html">Payments</a>
        <a href="attendance.html">Attendance</a>
        <a class="active" href="settings.html">Settings</a>
      </nav>
      <div class="user-chip"><span data-user-email></span><button data-sign-out>Sign out</button></div>
    </header>
    <main class="page">
      <section class="page-heading">
        <div>
          <h1>Settings</h1>
          <p>Default month and mobile install guidance.</p>
        </div>
      </section>
      <section class="panel workflow-panel">
        <form id="settingsForm">
          <section class="form-card">
            <h2>Portal defaults</h2>
            <div class="form-grid">
              <label>Default current month<select id="settingsDefaultMonth" required></select></label>
              <label>Zelle phone<input id="settingsZellePhone" type="tel" value="2488859243"></label>
            </div>
            <button class="primary-action" type="submit">Save Settings</button>
          </section>
        </form>
        <section class="form-card">
          <h2>Install on phone</h2>
          <div id="installInstructions" class="meta-list"></div>
          <button class="primary-action" type="button" data-install-app hidden>Install app</button>
        </section>
        <div id="settingsStatus" class="status-line"></div>
      </section>
    </main>
    <script src="../js/config.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/ui.js"></script>
    <script src="../js/pwa.js"></script>
    <script src="../js/admin.js"></script>
  </body>
</html>
